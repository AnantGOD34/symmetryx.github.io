<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Room Chat 🔐</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="/socket.io/socket.io.js" onerror="window.socketIoFailed = true;"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-gradient: radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a);
            --sphere-1-color: rgba(255, 123, 0, 0.4);
            --sphere-2-color: rgba(168, 85, 247, 0.45);
            --border-gradient: linear-gradient(135deg, #ff7b00, #a855f7, #ff2a85);
            --box-bg: rgba(22, 8, 42, 0.85);
            --btn-bg: linear-gradient(135deg, #ff6000 0%, #ff9e00 50%, #9333ea 100%);
            --self-bubble: linear-gradient(135deg, #ff6000 0%, #c084fc 60%, #9333ea 100%);
            --sender-gradient: linear-gradient(90deg, #e879f9, #ff7b00);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 2s ease;
        }

        /* Ambient Glow Spheres */
        .glow-sphere-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--sphere-1-color), transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }
        .glow-sphere-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--sphere-2-color), transparent 70%);
            filter: blur(90px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }

        /* GRADIENT BORDER UTILITY */
        .gradient-box {
            position: relative;
            background: var(--box-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 123, 0, 0.2);
            transition: background 2s ease;
        }

        .gradient-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: var(--border-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 2s ease;
        }

        /* JOIN CARD / LOGIN OVERLAY */
        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9e00, #ff6000, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-card p {
            font-size: 0.9rem;
            color: #d8b4fe;
            margin-bottom: 26px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: linear-gradient(90deg, #ff9e00, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(12, 3, 26, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: transparent;
            background: rgba(20, 6, 40, 0.9);
            box-shadow: 0 0 0 2px #ff7b00, 0 0 15px rgba(255, 123, 0, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.4), 0 0 15px rgba(147, 51, 234, 0.3);
            transition: transform 0.2s ease, opacity 0.2s, box-shadow 0.2s, background 2s ease;
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(255, 96, 0, 0.6), 0 0 20px rgba(147, 51, 234, 0.5);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        /* MAIN CHAT CONTAINER */
        .chat-wrapper {
            display: none;
            width: 95%;
            max-width: 950px;
            height: 90vh;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        /* CHAT HEADER */
        .chat-header {
            padding: 18px 24px;
            background: linear-gradient(90deg, rgba(30, 8, 55, 0.9), rgba(18, 4, 34, 0.95));
            border-bottom: 1px solid rgba(255, 123, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
        }

        .chat-header .room-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: var(--btn-bg);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            box-shadow: 0 0 10px rgba(255, 96, 0, 0.4);
            transition: background 2s ease;
        }

        .chat-header h3 {
            font-size: 1.2rem;
            background: linear-gradient(90deg, #ffffff, #ffb703, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .leave-btn {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(255, 96, 0, 0.2));
            border: 1px solid rgba(255, 96, 0, 0.5);
            color: #ffb703;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .leave-btn:hover {
            background: linear-gradient(135deg, #ef4444, #ff6000);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        /* MESSAGES AREA */
        .messages-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            background: rgba(14, 3, 28, 0.6);
        }

        .messages-box::-webkit-scrollbar {
            width: 7px;
        }
        .messages-box::-webkit-scrollbar-thumb {
            background: var(--border-gradient);
            border-radius: 10px;
            transition: background 2s ease;
        }

        /* DATE SEPARATOR */
        .date-separator {
            align-self: center;
            margin: 12px 0;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #d8b4fe;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* MESSAGE BUBBLES */
        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeInMsg 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.self {
            align-self: flex-end;
        }

        .message-row.other {
            align-self: flex-start;
        }

        .message-row.system {
            align-self: center;
            max-width: 90%;
            text-align: center;
        }

        .system-pill {
            background: linear-gradient(135deg, rgba(255, 123, 0, 0.15), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(255, 157, 0, 0.4);
            color: #f3e8ff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }

        .sender-name {
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 4px;
            padding-left: 2px;
            background: linear-gradient(90deg, #ff9e00, #ff6000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-row.self .sender-name {
            text-align: right;
            padding-right: 2px;
            background: var(--sender-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: background 2s ease;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message-row.self .bubble {
            background: var(--self-bubble);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 6px 18px rgba(255, 96, 0, 0.35);
            transition: background 2s ease;
        }

        .message-row.other .bubble {
            background: linear-gradient(135deg, rgba(48, 14, 82, 0.95), rgba(28, 6, 52, 0.95));
            border: 1px solid rgba(255, 123, 0, 0.35);
            color: #f3e8ff;
            border-bottom-left-radius: 2px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        }

        .time-stamp {
            font-size: 0.68rem;
            opacity: 0.85;
            margin-top: 5px;
            display: block;
            text-align: right;
            color: rgba(255, 255, 255, 0.85);
        }

        /* INPUT FOOTER AREA */
        .chat-input-area {
            padding: 16px 20px;
            background: linear-gradient(90deg, rgba(20, 5, 38, 0.95), rgba(12, 3, 24, 0.95));
            border-top: 1px solid rgba(255, 123, 0, 0.25);
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 13px 18px;
            background: rgba(10, 2, 20, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 0.98rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .chat-input-area input[type="text"]:focus {
            border-color: transparent;
            box-shadow: 0 0 0 2px #ff7b00, 0 0 15px rgba(255, 123, 0, 0.4);
        }

        .send-btn {
            background: var(--btn-bg);
            border: none;
            color: white;
            padding: 13px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 96, 0, 0.4);
            transition: all 0.2s ease, background 2s ease;
        }

        .send-btn:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.6);
            transform: translateY(-1px);
        }

        .send-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 600px) {
            .chat-wrapper {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            .chat-wrapper.gradient-box::before {
                border-radius: 0;
            }
            .chat-header, .chat-input-area {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <div class="login-card gradient-box" id="loginCard">
        <h2>Secret Chat Vault</h2>
        <p>Enter details to join or create a private room</p>

        <form id="joinForm" onsubmit="handleJoinSubmit(event)">
            <div class="input-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="e.g. Alex" maxlength="20" required>
            </div>

            <div class="input-group">
                <label for="roomId">Room ID</label>
                <input type="text" id="roomId" placeholder="e.g. SecretZone" maxlength="25" required>
            </div>

            <div class="input-group">
                <label for="roomPass">Room Password</label>
                <input type="password" id="roomPass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" id="joinBtn">Join Secret Room</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>

    <div class="chat-wrapper gradient-box" id="chatWrapper">
        <div class="chat-header">
            <div class="room-title">
                <span class="room-badge">Secret Room</span>
                <h3 id="displayRoomId">Room</h3>
            </div>
            <button class="leave-btn" onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="messages-box" id="messagesBox"></div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)" autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let socket = null;

        if (typeof io !== 'undefined') {
            socket = io();
        }

        let currentUserName = '';
        let currentRoomId = '';
        let lastRenderedDateString = '';

        const loginCard = document.getElementById('loginCard');
        const chatWrapper = document.getElementById('chatWrapper');
        const loginError = document.getElementById('loginError');
        const displayRoomId = document.getElementById('displayRoomId');
        const messagesBox = document.getElementById('messagesBox');
        const messageInput = document.getElementById('messageInput');

        // --- COMPREHENSIVE COLOR THEME CYCLER ---
        const themes = [
            {
                bg: 'radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a)',
                s1: 'rgba(255, 123, 0, 0.4)',
                s2: 'rgba(168, 85, 247, 0.45)',
                border: 'linear-gradient(135deg, #ff7b00, #a855f7, #ff2a85)',
                boxBg: 'rgba(22, 8, 42, 0.85)',
                btnBg: 'linear-gradient(135deg, #ff6000 0%, #ff9e00 50%, #9333ea 100%)',
                selfBubble: 'linear-gradient(135deg, #ff6000 0%, #c084fc 60%, #9333ea 100%)',
                senderGradient: 'linear-gradient(90deg, #e879f9, #ff7b00)'
            },
            {
                bg: 'radial-gradient(circle at top right, #03045e, #023e8a, #03071e)',
                s1: 'rgba(0, 180, 216, 0.4)',
                s2: 'rgba(72, 202, 228, 0.45)',
                border: 'linear-gradient(135deg, #00b4d8, #90e0ef, #0077b6)',
                boxBg: 'rgba(3, 29, 61, 0.85)',
                btnBg: 'linear-gradient(135deg, #0077b6 0%, #00b4d8 50%, #48cae4 100%)',
                selfBubble: 'linear-gradient(135deg, #0077b6 0%, #00b4d8 60%, #90e0ef 100%)',
                senderGradient: 'linear-gradient(90deg, #90e0ef, #00b4d8)'
            },
            {
                bg: 'radial-gradient(circle at top right, #1b4332, #081c15, #02100b)',
                s1: 'rgba(82, 183, 136, 0.4)',
                s2: 'rgba(149, 213, 178, 0.45)',
                border: 'linear-gradient(135deg, #52b788, #74c69d, #2d6a4f)',
                boxBg: 'rgba(8, 38, 26, 0.85)',
                btnBg: 'linear-gradient(135deg, #2d6a4f 0%, #52b788 50%, #74c69d 100%)',
                selfBubble: 'linear-gradient(135deg, #2d6a4f 0%, #52b788 60%, #95d5b2 100%)',
                senderGradient: 'linear-gradient(90deg, #95d5b2, #52b788)'
            },
            {
                bg: 'radial-gradient(circle at top right, #590d22, #2e020c, #140003)',
                s1: 'rgba(255, 75, 110, 0.4)',
                s2: 'rgba(255, 128, 148, 0.45)',
                border: 'linear-gradient(135deg, #ff4b6e, #ff819c, #c9184a)',
                boxBg: 'rgba(46, 5, 15, 0.85)',
                btnBg: 'linear-gradient(135deg, #c9184a 0%, #ff4b6e 50%, #ff819c 100%)',
                selfBubble: 'linear-gradient(135deg, #c9184a 0%, #ff4b6e 60%, #ff819c 100%)',
                senderGradient: 'linear-gradient(90deg, #ff819c, #ff4b6e)'
            },
            {
                bg: 'radial-gradient(circle at top right, #3a0ca3, #240046, #10002b)',
                s1: 'rgba(76, 201, 240, 0.4)',
                s2: 'rgba(114, 9, 183, 0.45)',
                border: 'linear-gradient(135deg, #4cc9f0, #7209b7, #f72585)',
                boxBg: 'rgba(28, 5, 56, 0.85)',
                btnBg: 'linear-gradient(135deg, #7209b7 0%, #4cc9f0 50%, #f72585 100%)',
                selfBubble: 'linear-gradient(135deg, #7209b7 0%, #4cc9f0 60%, #f72585 100%)',
                senderGradient: 'linear-gradient(90deg, #f72585, #4cc9f0)'
            }
        ];

        let currentThemeIndex = 0;

        function applyTheme(theme) {
            const root = document.documentElement;
            root.style.setProperty('--bg-gradient', theme.bg);
            root.style.setProperty('--sphere-1-color', theme.s1);
            root.style.setProperty('--sphere-2-color', theme.s2);
            root.style.setProperty('--border-gradient', theme.border);
            root.style.setProperty('--box-bg', theme.boxBg);
            root.style.setProperty('--btn-bg', theme.btnBg);
            root.style.setProperty('--self-bubble', theme.selfBubble);
            root.style.setProperty('--sender-gradient', theme.senderGradient);
        }

        // Change theme every 60 seconds (60000 milliseconds)
        setInterval(() => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            applyTheme(themes[currentThemeIndex]);
        }, 60000);
        // ------------------------------------

        function handleJoinSubmit(e) {
            e.preventDefault();
            joinRoom();
        }

        function joinRoom() {
            const name = document.getElementById('userName').value.trim();
            const roomId = document.getElementById('roomId').value.trim();
            const roomPass = document.getElementById('roomPass').value.trim();

            if (!name || !roomId || !roomPass) {
                showError('Please fill in all fields!');
                return;
            }

            loginError.style.display = 'none';

            if (socket) {
                socket.emit('join-room', { name, roomId, roomPass });
            } else {
                showError('Could not connect to the server.');
            }
        }

        if (socket) {
            socket.on('join-response', (res) => {
                if (!res.success) {
                    showError(res.message);
                    return;
                }

                currentUserName = document.getElementById('userName').value.trim();
                currentRoomId = res.roomId;

                displayRoomId.textContent = `#${currentRoomId}`;
                loginCard.style.display = 'none';
                chatWrapper.style.display = 'flex';
                messagesBox.innerHTML = '';
                lastRenderedDateString = '';

                if (res.history && res.history.length > 0) {
                    res.history.forEach(msg => renderMessage(msg));
                    scrollToBottom();
                }
            });

            socket.on('chat-message', (msgData) => {
                renderMessage(msgData);
                scrollToBottom();
            });
        }

        function parseMessageDate(msg) {
            const rawTime = msg.timestamp || msg.time || msg.createdAt || msg.date;
            if (!rawTime) return new Date();
            
            const parsed = new Date(rawTime);
            return isNaN(parsed.getTime()) ? new Date() : parsed;
        }

        function formatCustomTimestamp(dateObj) {
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const yy = String(dateObj.getFullYear()).slice(-2);
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            return `${dd}-${mm}-${yy} ${hh}-${min}`;
        }

        function renderMessage(msg) {
            const msgDate = parseMessageDate(msg);
            const formattedTimestamp = formatCustomTimestamp(msgDate);

            const dateStr = msgDate.toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            if (dateStr !== lastRenderedDateString) {
                lastRenderedDateString = dateStr;
                const dateDiv = document.createElement('div');
                dateDiv.className = 'date-separator';

                const todayStr = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yesterdayStr = yesterday.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' });

                if (dateStr === todayStr) {
                    dateDiv.textContent = 'Today';
                } else if (dateStr === yesterdayStr) {
                    dateDiv.textContent = 'Yesterday';
                } else {
                    dateDiv.textContent = dateStr;
                }

                messagesBox.appendChild(dateDiv);
            }

            const row = document.createElement('div');

            if (msg.isSystem) {
                row.className = 'message-row system';
                row.innerHTML = `
                    <div class="system-pill">
                        <span>🔒 ${formatMessageText(msg.message)}</span>
                        <span style="font-size: 0.68rem; opacity: 0.75;">${formattedTimestamp}</span>
                    </div>
                `;
            } else {
                const isSelf = msg.name === currentUserName;
                row.className = `message-row ${isSelf ? 'self' : 'other'}`;

                let contentHtml = '';
                if (msg.message) {
                    contentHtml += `<div>${formatMessageText(msg.message)}</div>`;
                }

                row.innerHTML = `
                    <div class="sender-name">${escapeHTML(msg.name)}</div>
                    <div class="bubble">
                        ${contentHtml}
                        <span class="time-stamp">${formattedTimestamp}</span>
                    </div>
                `;
            }

            messagesBox.appendChild(row);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            if (socket && socket.connected) {
                socket.emit('chat-message', text);
            }

            messageInput.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        }

        function leaveRoom() {
            location.reload();
        }

        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        function scrollToBottom() {
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatMessageText(str) {
            if (!str) return '';
            const sanitized = escapeHTML(str);
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;

            return sanitized.replace(urlRegex, (url) => {
                const href = url.startsWith('www.') ? `http://${url}` : url;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: #64dfdf; text-decoration: underline; word-break: break-all;">${url}</a>`;
            });
        }
    </script>
</body>
</html>
