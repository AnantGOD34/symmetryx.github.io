<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        :root {
            --theme-primary: #ff7b00;
            --theme-secondary: #a855f7;
            --theme-accent: #ff2a85;
            --bg-gradient: radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a);
            --theme-glow-1: rgba(255, 123, 0, 0.4);
            --theme-glow-2: rgba(168, 85, 247, 0.45);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 1s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background: rgba(15, 15, 30, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 75%;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.05);
        }

        .message.system {
            align-self: center;
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            background: transparent;
            font-size: 0.9rem;
        }

        .message .timestamp {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            outline: none;
        }

        .chat-input-area button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: var(--theme-primary);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-input-area button:hover {
            background: var(--theme-secondary);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const username = prompt("Enter your name:") || "Anonymous";
        const roomId = "general";

        socket.emit('join-room', { name: username, roomId: roomId });

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function parseMessageDate(msg) {
            const rawTime = msg.timestamp || msg.date || msg.createdAt;
            if (rawTime) {
                const parsed = new Date(rawTime);
                if (!isNaN(parsed.getTime())) return parsed;
            }
            return new Date();
        }

        function applyHourlyTheme() {
            const hour = new Date().getHours();
            const primaryHue = (hour * 15) % 360;
            const secondaryHue = (primaryHue + 55) % 360;
            const accentHue = (primaryHue + 120) % 360;

            const root = document.documentElement;
            root.style.setProperty('--theme-primary', `hsl(${primaryHue}, 85%, 55%)`);
            root.style.setProperty('--theme-secondary', `hsl(${secondaryHue}, 80%, 60%)`);
            root.style.setProperty('--theme-accent', `hsl(${accentHue}, 90%, 65%)`);
            root.style.setProperty('--theme-glow-1', `hsla(${primaryHue}, 90%, 60%, 0.4)`);
            root.style.setProperty('--theme-glow-2', `hsla(${secondaryHue}, 85%, 55%, 0.45)`);
            root.style.setProperty('--bg-gradient', `radial-gradient(circle at top right, hsl(${primaryHue}, 50%, 14%), hsl(${secondaryHue}, 40%, 10%), #0d001a)`);
        }

        applyHourlyTheme();
        setInterval(applyHourlyTheme, 60000);

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.classList.add('message');
            if (msg.isSystem) {
                div.classList.add('system');
                div.textContent = msg.message;
            } else {
                const dateObj = parseMessageDate(msg);
                const timeString = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `<strong>${msg.name}</strong>: ${msg.message}<div class="timestamp">${timeString}</div>`;
            }
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        socket.on('room-history', (history) => {
            chatMessages.innerHTML = '';
            history.forEach(appendMessage);
        });

        socket.on('chat-message', (msg) => {
            appendMessage(msg);
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                socket.emit('chat-message', text);
                messageInput.value = '';
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
