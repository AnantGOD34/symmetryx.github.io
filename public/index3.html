<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secret Room Chat 🔐</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="/socket.io/socket.io.js" onerror="window.socketIoFailed = true;"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .glow-sphere-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 123, 0, 0.4), transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
        }
        .glow-sphere-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.45), transparent 70%);
            filter: blur(90px);
            border-radius: 50%;
            pointer-events: none;
        }
        .gradient-box {
            position: relative;
            background: rgba(22, 8, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 123, 0, 0.2);
        }
        .gradient-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: linear-gradient(135deg, #ff7b00, #a855f7, #ff2a85);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            z-index: 10;
        }
        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9e00, #ff6000, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .login-card p {
            font-size: 0.9rem;
            color: #d8b4fe;
            margin-bottom: 26px;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #ff9e00;
            margin-bottom: 6px;
            font-weight: 800;
        }
        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(12, 3, 26, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6000 0%, #ff9e00 50%, #9333ea 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }
        .chat-wrapper {
            display: none;
            width: 95%;
            max-width: 950px;
            height: 90vh;
            flex-direction: column;
            z-index: 10;
        }
        .chat-header {
            padding: 18px 24px;
            background: linear-gradient(90deg, rgba(30, 8, 55, 0.9), rgba(18, 4, 34, 0.95));
            border-bottom: 1px solid rgba(255, 123, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: rgba(12, 3, 26, 0.6);
        }
        .chat-input-area {
            padding: 16px;
            background: rgba(18, 4, 34, 0.9);
            display: flex;
            gap: 12px;
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            background: rgba(12, 3, 26, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 10px;
            color: #fff;
            outline: none;
        }
        .chat-input-area button {
            padding: 0 20px;
            background: linear-gradient(135deg, #ff6000, #9333ea);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <!-- Login Card -->
    <div id="loginCard" class="gradient-box login-card">
        <h2>Secret Room</h2>
        <p>Enter your details to join the secure chat.</p>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Your name..." required autocomplete="off">
            </div>
            <div class="input-group">
                <label for="room">Room Code</label>
                <input type="text" id="room" placeholder="Room name..." required autocomplete="off">
            </div>
            <button type="submit" class="btn-primary">Join Room</button>
        </form>
    </div>

    <!-- Chat Wrapper -->
    <div id="chatWrapper" class="gradient-box chat-wrapper">
        <div class="chat-header">
            <div class="room-title"><span>Secure Chat Room</span></div>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginCard = document.getElementById('loginCard');
        const chatWrapper = document.getElementById('chatWrapper');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevents page reload
            const username = document.getElementById('username').value.trim();
            const room = document.getElementById('room').value.trim();

            if (username && room) {
                loginCard.style.display = 'none';
                chatWrapper.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
