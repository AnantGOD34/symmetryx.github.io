<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flux 🔐</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="/socket.io/socket.io.js" onerror="window.socketIoFailed = true;"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-gradient: radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a);
            --sphere-1-color: rgba(255, 123, 0, 0.4);
            --sphere-2-color: rgba(168, 85, 247, 0.45);
            --border-gradient: linear-gradient(135deg, #ff7b00, #a855f7, #ff2a85);
            --box-bg: rgba(22, 8, 42, 0.85);
            --btn-bg: linear-gradient(135deg, #ff6000 0%, #ff9e00 50%, #9333ea 100%);
            --self-bubble: linear-gradient(135deg, #ff6000 0%, #c084fc 60%, #9333ea 100%);
            --sender-gradient: linear-gradient(90deg, #e879f9, #ff7b00);
            --text-color: #ffffff;
        }

        body.light-mode {
            --bg-gradient: radial-gradient(circle at top right, #f3e8ff, #e9d5ff, #f8fafc);
            --sphere-1-color: rgba(255, 123, 0, 0.2);
            --sphere-2-color: rgba(168, 85, 247, 0.2);
            --border-gradient: linear-gradient(135deg, #a855f7, #ff7b00);
            --box-bg: rgba(255, 255, 255, 0.9);
            --text-color: #1e1b4b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .glow-sphere-1, .glow-sphere-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }
        .glow-sphere-1 { top: -15%; left: -10%; background: radial-gradient(circle, var(--sphere-1-color), transparent 70%); }
        .glow-sphere-2 { bottom: -15%; right: -10%; background: radial-gradient(circle, var(--sphere-2-color), transparent 70%); }

        .gradient-box {
            position: relative;
            background: var(--box-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 123, 0, 0.1);
            transition: background 0.5s ease;
        }

        .gradient-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: var(--border-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* LOGIN CARD */
        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            z-index: 10;
        }

        .login-card h2 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9e00, #ff6000, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .login-card p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 26px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 800;
            margin-bottom: 6px;
            opacity: 0.9;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(12, 3, 26, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.4);
            transition: transform 0.2s ease, opacity 0.2s;
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        /* CHAT CONTAINER */
        .chat-wrapper {
            display: none;
            width: 95%;
            max-width: 1050px;
            height: 90vh;
            flex-direction: row;
            overflow: hidden;
            z-index: 10;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        /* SIDEBAR / USERS LIST */
        .chat-sidebar {
            width: 240px;
            border-right: 1px solid rgba(168, 85, 247, 0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.1);
        }

        .chat-sidebar h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            opacity: 0.7;
        }

        .user-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .user-item {
            font-size: 0.9rem;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-item::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        /* HEADER & SEARCH */
        .chat-header {
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 123, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: inherit;
            font-size: 0.85rem;
            outline: none;
            width: 180px;
            transition: width 0.3s;
        }
        .search-bar:focus { width: 240px; }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: inherit;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* MESSAGES AREA */
        .messages-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .date-separator {
            align-self: center;
            margin: 12px 0;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            opacity: 0.8;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            position: relative;
        }

        .message-row.self { align-self: flex-end; }
        .message-row.other { align-self: flex-start; }
        .message-row.system { align-self: center; max-width: 90%; text-align: center; }

        .system-pill {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(255, 157, 0, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .sender-name {
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #ff9e00, #ff6000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-row.self .sender-name { text-align: right; }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message-row.self .bubble {
            background: var(--self-bubble);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(255, 96, 0, 0.3);
        }

        .message-row.other .bubble {
            background: rgba(48, 14, 82, 0.2);
            border: 1px solid rgba(255, 123, 0, 0.25);
            border-bottom-left-radius: 2px;
        }

        /* METADATA & STATUS */
        .msg-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            font-size: 0.68rem;
            opacity: 0.8;
        }

        .read-receipt {
            font-weight: bold;
            color: #38bdf8;
        }

        /* REACTIONS */
        .reactions-container {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .reaction-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .add-reaction-btn {
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .message-row:hover .add-reaction-btn { opacity: 1; }

        /* LINK PREVIEW CARDS */
        .link-preview {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 8px;
            margin-top: 8px;
            display: flex;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-decoration: none;
            color: inherit;
        }
        .link-preview img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
        .link-info h6 { font-size: 0.8rem; font-weight: 700; margin-bottom: 2px; }
        .link-info p { font-size: 0.7rem; opacity: 0.7; }

        /* TYPING INDICATOR */
        .typing-indicator {
            padding: 4px 24px;
            font-size: 0.75rem;
            font-style: italic;
            opacity: 0.7;
            min-height: 22px;
        }

        /* INPUT FOOTER */
        .chat-input-area {
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.15);
            border-top: 1px solid rgba(255, 123, 0, 0.2);
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px;
            color: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: inherit;
            padding: 10px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .send-btn {
            background: var(--btn-bg);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        /* EMOJI PICKER POPUP */
        .emoji-picker {
            position: absolute;
            bottom: 75px;
            left: 20px;
            background: #1e1b4b;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .emoji-picker span {
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            text-align: center;
            border-radius: 6px;
        }
        .emoji-picker span:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <!-- LOGIN SCREEN -->
    <div class="login-card gradient-box" id="loginCard">
        <h2>Flux 🔐</h2>
        <p>Advanced Real-time Encrypted Chat</p>

        <form id="joinForm" onsubmit="handleJoinSubmit(event)">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="userName" placeholder="e.g. Alex" maxlength="20" required>
            </div>
            <div class="input-group">
                <label>Room ID</label>
                <input type="text" id="roomId" placeholder="e.g. SecretZone" maxlength="25" required>
            </div>
            <div class="input-group">
                <label>Room Password</label>
                <input type="password" id="roomPass" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary">Join Room</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>

    <!-- CHAT INTERFACE -->
    <div class="chat-wrapper gradient-box" id="chatWrapper">
        <!-- Sidebar / User List -->
        <div class="chat-sidebar">
            <h4>Online Users (<span id="userCount">0</span>)</h4>
            <ul class="user-list" id="userList"></ul>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-main">
            <div class="chat-header">
                <div>
                    <span id="displayRoomId" style="font-weight: 800; font-size: 1.1rem;">#Room</span>
                </div>
                <div class="header-controls">
                    <input type="text" class="search-bar" id="searchBar" placeholder="Search messages..." oninput="filterMessages(this.value)">
                    <button class="icon-btn" onclick="toggleTheme()">☀️ / 🌙</button>
                    <button class="icon-btn" onclick="leaveRoom()" style="border-color: #ef4444; color: #ef4444;">Leave</button>
                </div>
            </div>

            <div class="messages-box" id="messagesBox"></div>

            <div class="typing-indicator" id="typingIndicator"></div>

            <div class="chat-input-area">
                <!-- Emoji Picker -->
                <div class="emoji-picker" id="emojiPicker">
                    <span onclick="insertEmoji('😊')">😊</span>
                    <span onclick="insertEmoji('😂')">😂</span>
                    <span onclick="insertEmoji('❤️')">❤️</span>
                    <span onclick="insertEmoji('🔥')">🔥</span>
                    <span onclick="insertEmoji('👍')">👍</span>
                    <span onclick="insertEmoji('🎉')">🎉</span>
                    <span onclick="insertEmoji('🚀')">🚀</span>
                    <span onclick="insertEmoji('😎')">😎</span>
                    <span onclick="insertEmoji('💡')">💡</span>
                    <span onclick="insertEmoji('✨')">✨</span>
                </div>

                <button class="action-btn" onclick="toggleEmojiPicker()" title="Emoji Picker">😊</button>
                <input type="file" id="fileInput" style="display: none;" accept="image/*,video/*,audio/*" onchange="handleFileSelect(event)">
                <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="Attach File">📎</button>
                <button class="action-btn" id="recordBtn" onclick="toggleVoiceRecording()" title="Record Voice">🎤</button>
                
                <input type="text" id="messageInput" placeholder="Type a message..." oninput="emitTyping()" onkeydown="handleKeyPress(event)" autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket = typeof io !== 'undefined' ? io() : null;
        let currentUserName = '';
        let currentRoomId = '';
        let lastRenderedDateString = '';
        let selectedFilePayload = null;
        let typingTimeout = null;
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let messagesStore = [];

        const loginCard = document.getElementById('loginCard');
        const chatWrapper = document.getElementById('chatWrapper');
        const loginError = document.getElementById('loginError');
        const displayRoomId = document.getElementById('displayRoomId');
        const messagesBox = document.getElementById('messagesBox');
        const messageInput = document.getElementById('messageInput');
        const userList = document.getElementById('userList');
        const userCount = document.getElementById('userCount');
        const typingIndicator = document.getElementById('typingIndicator');
        const emojiPicker = document.getElementById('emojiPicker');

        function handleJoinSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const roomId = document.getElementById('roomId').value.trim();
            const roomPass = document.getElementById('roomPass').value.trim();

            if (!name || !roomId || !roomPass) return showError('All fields are required.');
            if (socket) socket.emit('join-room', { name, roomId, roomPass });
        }

        if (socket) {
            socket.on('join-response', (res) => {
                if (!res.success) return showError(res.message);
                currentUserName = document.getElementById('userName').value.trim();
                currentRoomId = res.roomId;
                displayRoomId.textContent = `#${currentRoomId}`;
                loginCard.style.display = 'none';
                chatWrapper.style.display = 'flex';
                messagesBox.innerHTML = '';
                messagesStore = [];
                if (res.history) {
                    res.history.forEach(msg => { messagesStore.push(msg); renderMessage(msg); });
                    scrollToBottom();
                }
            });

            socket.on('chat-message', (msg) => {
                messagesStore.push(msg);
                renderMessage(msg);
                scrollToBottom();
            });

            socket.on('room-users', (users) => {
                userList.innerHTML = '';
                userCount.textContent = users.length;
                users.forEach(u => {
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.textContent = u;
                    userList.appendChild(li);
                });
            });

            socket.on('typing-update', (data) => {
                if (data.name !== currentUserName) {
                    typingIndicator.textContent = data.isTyping ? `${data.name} is typing...` : '';
                }
            });

            socket.on('message-reaction', ({ messageId, reactions }) => {
                const msgEl = document.querySelector(`[data-id="${messageId}"]`);
                if (msgEl) {
                    let container = msgEl.querySelector('.reactions-container');
                    container.innerHTML = Object.entries(reactions).map(([emoji, count]) => `
                        <span class="reaction-badge">${emoji} ${count}</span>
                    `).join('');
                }
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function toggleEmojiPicker() {
            emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
        }

        function insertEmoji(emoji) {
            messageInput.value += emoji;
            emojiPicker.style.display = 'none';
            messageInput.focus();
        }

        function emitTyping() {
            if (!socket) return;
            socket.emit('typing', { isTyping: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { isTyping: false });
            }, 1500);
        }

        function renderMessage(msg) {
            const msgDate = msg.timestamp ? new Date(msg.timestamp) : new Date();
            const timeStr = `${String(msgDate.getHours()).padStart(2, '0')}:${String(msgDate.getMinutes()).padStart(2, '0')}`;
            const dateStr = msgDate.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

            if (dateStr !== lastRenderedDateString) {
                lastRenderedDateString = dateStr;
                const dateDiv = document.createElement('div');
                dateDiv.className = 'date-separator';
                dateDiv.textContent = dateStr;
                messagesBox.appendChild(dateDiv);
            }

            const row = document.createElement('div');
            const msgId = msg.id || Math.random().toString(36).substr(2, 9);
            row.dataset.id = msgId;

            if (msg.isSystem) {
                row.className = 'message-row system';
                row.innerHTML = `<div class="system-pill">🔒 ${escapeHTML(msg.message)}</div>`;
            } else {
                const isSelf = msg.name === currentUserName;
                row.className = `message-row ${isSelf ? 'self' : 'other'}`;

                let contentHtml = '';
                if (msg.file) {
                    if (msg.file.type === 'image') contentHtml += `<img src="${msg.file.dataUrl}" style="max-width:220px; border-radius:8px; margin-bottom:6px;" />`;
                    else if (msg.file.type === 'video') contentHtml += `<video src="${msg.file.dataUrl}" style="max-width:240px; border-radius:8px;" controls></video>`;
                    else if (msg.file.type === 'audio') contentHtml += `<audio src="${msg.file.dataUrl}" style="width:200px;" controls></audio>`;
                }
                if (msg.message) {
                    contentHtml += `<div>${formatLinks(msg.message)}</div>`;
                    // Simple URL link preview simulation for first detected URL
                    const urlMatch = msg.message.match(/(https?:\/\/[^\s]+)/);
                    if (urlMatch) {
                        contentHtml += `
                            <a href="${urlMatch[0]}" target="_blank" class="link-preview">
                                <div class="link-info">
                                    <h6>${urlMatch[0]}</h6>
                                    <p>Click to open external link preview</p>
                                </div>
                            </a>
                        `;
                    }
                }

                let reactionsHtml = '';
                if (msg.reactions) {
                    reactionsHtml = Object.entries(msg.reactions).map(([emoji, count]) => `
                        <span class="reaction-badge">${emoji} ${count}</span>
                    `).join('');
                }

                row.innerHTML = `
                    <div class="sender-name">${escapeHTML(msg.name)}</div>
                    <div class="bubble">
                        ${contentHtml}
                        <div class="msg-meta">
                            <span>${timeStr}</span>
                            ${isSelf ? '<span class="read-receipt">✓✓</span>' : ''}
                            <span class="add-reaction-btn" onclick="addReaction('${msgId}', '❤️')">➕❤️</span>
                        </div>
                    </div>
                    <div class="reactions-container">${reactionsHtml}</div>
                `;
            }
            messagesBox.appendChild(row);
        }

        function addReaction(messageId, emoji) {
            if (socket) socket.emit('add-reaction', { messageId, emoji });
        }

        function formatLinks(str) {
            const sanitized = escapeHTML(str);
            return sanitized.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #38bdf8; text-decoration: underline;">$1</a>');
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedFilePayload) return;
            if (socket) {
                socket.emit('chat-message', { message: text, file: selectedFilePayload, id: Math.random().toString(36).substr(2, 9) });
            }
            messageInput.value = '';
            selectedFilePayload = null;
        }

        function handleKeyPress(e) { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const type = file.type.startsWith('video') ? 'video' : file.type.startsWith('audio') ? 'audio' : 'image';
                selectedFilePayload = { type, dataUrl: evt.target.result };
                sendMessage();
            };
            reader.readAsDataURL(file);
        }

        async function toggleVoiceRecording() {
            const recordBtn = document.getElementById('recordBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = evt => {
                            selectedFilePayload = { type: 'audio', dataUrl: evt.target.result };
                            sendMessage();
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.style.background = '#ef4444';
                } catch(err) { alert('Microphone access denied.'); }
            } else {
                if (mediaRecorder) mediaRecorder.stop();
                isRecording = false;
                recordBtn.style.background = '';
            }
        }

        function filterMessages(query) {
            messagesBox.innerHTML = '';
            lastRenderedDateString = '';
            const filtered = messagesStore.filter(m => m.message && m.message.toLowerCase().includes(query.toLowerCase()));
            filtered.forEach(msg => renderMessage(msg));
        }

        function leaveRoom() { location.reload(); }
        function showError(msg) { loginError.textContent = msg; loginError.style.display = 'block'; }
        function scrollToBottom() { messagesBox.scrollTop = messagesBox.scrollHeight; }
        function escapeHTML(str) { return str ? str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)) : ''; }
    </script>
</body>
</html>
