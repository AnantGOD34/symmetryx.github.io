<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Theme Transition</title>
  <style>
    :root {
      --primary-color: #ff7e5f;
      --secondary-color: #7b2cbf;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      transition: background 3s ease-in-out;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      transition: all 3s ease-in-out;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    .btn {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: background-color 3s ease-in-out, transform 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Matching Theme Transitions</h1>
    <p>Colors smoothly shift every minute.</p>
    <button class="btn">Interactive Element</button>
  </div>

  <script>
    const colorPairs = [
      { primary: '#ff7e5f', secondary: '#7b2cbf' }, // Orange & Purple
      { primary: '#ff4b91', secondary: '#2ec4b6' }, // Pink & Green
      { primary: '#3a86ff', secondary: '#ff006e' }, // Blue & Magenta
      { primary: '#ffbe0b', secondary: '#3a86ff' }, // Yellow & Blue
      { primary: '#06d6a0', secondary: '#118ab2' }  // Mint & Teal
    ];

    let currentIndex = 0;

    function updateThemeColors() {
      currentIndex = (currentIndex + 1) % colorPairs.length;
      const pair = colorPairs[currentIndex];

      document.documentElement.style.setProperty('--primary-color', pair.primary);
      document.documentElement.style.setProperty('--secondary-color', pair.secondary);
    }

    // Changes colors every 60,000 milliseconds (1 minute)
    setInterval(updateThemeColors, 60000);
  </script>

</body>
</html>
