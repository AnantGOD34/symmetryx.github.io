<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flux Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: #2d2d2d;
            padding: 10px 15px;
            border-radius: 8px;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.user {
            background: #007acc;
            align-self: flex-end;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background: #252526;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #3c3c3c;
            color: #white;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #005999;
        }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <div id="input-container">
        <input type="file" id="file-input" style="display: none;" onchange="sendFile(this)">
        <button onclick="document.getElementById('file-input').click()">📁</button>
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Load saved messages safely from localStorage on startup
        document.addEventListener("DOMContentLoaded", () => {
            loadMessages();
        });

        function getStoredMessages() {
            try {
                const data = localStorage.getItem('flux_messages');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error("Failed to parse local storage", e);
                return [];
            }
        }

        function saveMessageToStorage(sender, text, type = 'text') {
            try {
                const messages = getStoredMessages();
                messages.push({ sender, text, type, timestamp: Date.now() });
                localStorage.setItem('flux_messages', JSON.stringify(messages));
            } catch (e) {
                console.error("Storage limit reached or error saving:", e);
            }
        }

        function loadMessages() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            const messages = getStoredMessages();
            
            messages.forEach(msg => {
                appendMessageToDOM(msg.sender, msg.text, msg.type, false);
            });
            scrollToBottom();
        }

        function appendMessageToDOM(sender, text, type = 'text', save = true) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'User' ? 'user' : 'other'}`;

            if (type === 'file') {
                msgDiv.innerHTML = `<strong>${sender}:</strong> <a href="${text}" target="_blank" download>📄 Download File</a>`;
            } else {
                msgDiv.textContent = `${sender}: ${text}`;
            }

            container.appendChild(msgDiv);
            scrollToBottom();

            if (save) {
                saveMessageToStorage(sender, text, type);
            }
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessageToDOM('User', text, 'text', true);
            input.value = '';

            // Prevent UI locking by deferring response handling
            setTimeout(() => {
                // Mock response handler to keep UI fluid
                // Replace or hook up your backend/websocket communication here safely
            }, 100);
        }

        function sendFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                appendMessageToDOM('User', base64Data, 'file', true);
            };
            reader.readAsDataURL(file);
            input.value = ''; // Reset file input
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
