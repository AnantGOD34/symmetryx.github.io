<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flux 🔐</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="/socket.io/socket.io.js" onerror="window.socketIoFailed = true;"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-gradient: radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a);
            --sphere-1-color: rgba(255, 123, 0, 0.4);
            --sphere-2-color: rgba(168, 85, 247, 0.45);
            --border-gradient: linear-gradient(135deg, #ff7b00, #a855f7, #ff2a85);
            --box-bg: rgba(22, 8, 42, 0.85);
            --btn-bg: linear-gradient(135deg, #ff6000 0%, #ff9e00 50%, #9333ea 100%);
            --self-bubble: linear-gradient(135deg, #ff6000 0%, #c084fc 60%, #9333ea 100%);
            --sender-gradient: linear-gradient(90deg, #e879f9, #ff7b00);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 2s ease;
        }

        .glow-sphere-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--sphere-1-color), transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }
        .glow-sphere-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--sphere-2-color), transparent 70%);
            filter: blur(90px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }

        .gradient-box {
            position: relative;
            background: var(--box-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 123, 0, 0.2);
            transition: background 2s ease;
        }

        .gradient-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: var(--border-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 2s ease;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            z-index: 10;
        }

        .login-card h2 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9e00, #ff6000, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .login-card p {
            font-size: 0.9rem;
            color: #d8b4fe;
            margin-bottom: 26px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: linear-gradient(90deg, #ff9e00, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(12, 3, 26, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: transparent;
            background: rgba(20, 6, 40, 0.9);
            box-shadow: 0 0 0 2px #ff7b00, 0 0 15px rgba(255, 123, 0, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.4);
            transition: transform 0.2s ease, opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        .chat-wrapper {
            display: none;
            width: 95%;
            max-width: 950px;
            height: 90vh;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .chat-header {
            padding: 18px 24px;
            background: linear-gradient(90deg, rgba(30, 8, 55, 0.9), rgba(18, 4, 34, 0.95));
            border-bottom: 1px solid rgba(255, 123, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
        }

        .chat-header .room-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: var(--btn-bg);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .chat-header h3 {
            font-size: 1.2rem;
            background: linear-gradient(90deg, #ffffff, #ffb703, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .leave-btn {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(255, 96, 0, 0.2));
            border: 1px solid rgba(255, 96, 0, 0.5);
            color: #ffb703;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .leave-btn:hover {
            background: linear-gradient(135deg, #ef4444, #ff6000);
            color: white;
        }

        .messages-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
            background: rgba(14, 3, 28, 0.6);
        }

        .messages-box::-webkit-scrollbar {
            width: 7px;
        }
        .messages-box::-webkit-scrollbar-thumb {
            background: var(--border-gradient);
            border-radius: 10px;
        }

        .date-separator {
            align-self: center;
            margin: 12px 0;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #d8b4fe;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            animation: fadeInMsg 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-row.self {
            align-self: flex-end;
        }

        .message-row.other {
            align-self: flex-start;
        }

        .message-row.system {
            align-self: center;
            max-width: 90%;
            text-align: center;
        }

        .system-pill {
            background: linear-gradient(135deg, rgba(255, 123, 0, 0.15), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(255, 157, 0, 0.4);
            color: #f3e8ff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .sender-name {
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 4px;
            padding-left: 2px;
            background: linear-gradient(90deg, #ff9e00, #ff6000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-row.self .sender-name {
            text-align: right;
            padding-right: 2px;
            background: var(--sender-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message-row.self .bubble {
            background: var(--self-bubble);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 6px 18px rgba(255, 96, 0, 0.35);
        }

        .message-row.other .bubble {
            background: linear-gradient(135deg, rgba(48, 14, 82, 0.95), rgba(28, 6, 52, 0.95));
            border: 1px solid rgba(255, 123, 0, 0.35);
            color: #f3e8ff;
            border-bottom-left-radius: 2px;
        }

        .time-stamp {
            font-size: 0.68rem;
            opacity: 0.85;
            margin-top: 5px;
            display: block;
            text-align: right;
            color: rgba(255, 255, 255, 0.85);
        }

        .msg-actions {
            font-size: 0.72rem;
            display: flex;
            gap: 10px;
            margin-top: 4px;
            justify-content: flex-end;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .message-row.self:hover .msg-actions {
            opacity: 1;
        }

        .msg-action-btn {
            cursor: pointer;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .msg-action-btn.edit:hover { background: rgba(255, 183, 3, 0.3); color: #ffb703; }
        .msg-action-btn.delete:hover { background: rgba(239, 68, 68, 0.3); color: #ef4444; }

        .chat-media {
            max-width: 240px;
            max-height: 240px;
            border-radius: 12px;
            margin-bottom: 6px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .chat-video {
            width: 100%;
            max-width: 280px;
            border-radius: 12px;
            margin-bottom: 6px;
            outline: none;
            display: block;
        }
        .chat-audio {
            width: 220px;
            height: 36px;
            margin-bottom: 4px;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }
        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Unique Custom Voice Recording Overlay/Modal style */
        #recordingOverlay {
            display: none;
            position: absolute;
            bottom: 85px;
            left: 20px;
            right: 20px;
            background: rgba(18, 4, 38, 0.95);
            border: 1px solid rgba(255, 123, 0, 0.5);
            border-radius: 16px;
            padding: 14px 20px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 100;
            backdrop-filter: blur(10px);
            animation: slideUpRecord 0.2s ease-out;
        }

        @keyframes slideUpRecord {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .recording-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .recording-pulse-dot {
            width: 12px;
            height: 12px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 10px #ef4444;
            animation: pulseDot 1s infinite alternate;
        }

        @keyframes pulseDot {
            from { transform: scale(0.8); opacity: 0.6; }
            to { transform: scale(1.2); opacity: 1; }
        }

        .recording-timer {
            font-family: monospace;
            font-size: 1.1rem;
            color: #ffb703;
            font-weight: bold;
        }

        .waveform-bars {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 24px;
        }

        .wave-bar {
            width: 4px;
            background: var(--border-gradient);
            border-radius: 2px;
            animation: waveBounce 0.6s infinite ease-in-out alternate;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes waveBounce {
            from { height: 6px; }
            to { height: 24px; }
        }

        .chat-input-area {
            position: relative;
            padding: 16px 20px;
            background: linear-gradient(90deg, rgba(20, 5, 38, 0.95), rgba(12, 3, 24, 0.95));
            border-top: 1px solid rgba(255, 123, 0, 0.25);
            display: flex;
            gap: 12px;
            align-items: center;
            border-bottom-left-radius: 22px;
            border-bottom-right-radius: 22px;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            padding: 13px 18px;
            background: rgba(10, 2, 20, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 0.98rem;
            outline: none;
        }

        .send-btn {
            background: var(--btn-bg);
            border: none;
            color: white;
            padding: 13px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 96, 0, 0.4);
        }

        @media (max-width: 600px) {
            .chat-wrapper {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <div class="login-card gradient-box" id="loginCard">
        <h2>Flux</h2>
        <p>Enter details to join or create a private room</p>

        <form id="joinForm" onsubmit="handleJoinSubmit(event)">
            <div class="input-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="e.g. Alex" maxlength="20" required>
            </div>

            <div class="input-group">
                <label for="roomId">Room ID</label>
                <input type="text" id="roomId" placeholder="e.g. SecretZone" maxlength="25" required>
            </div>

            <div class="input-group">
                <label for="roomPass">Room Password</label>
                <input type="password" id="roomPass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" id="joinBtn">Join Flux Room</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>

    <div class="chat-wrapper gradient-box" id="chatWrapper">
        <div class="chat-header">
            <div class="room-title">
                <span class="room-badge">Flux</span>
                <h3 id="displayRoomId">Room</h3>
            </div>
            <button class="leave-btn" onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="messages-box" id="messagesBox"></div>

        <div class="chat-input-area">
            <!-- Custom Unique Voice Recording Waveform Overlay -->
            <div id="recordingOverlay">
                <div class="recording-info">
                    <div class="recording-pulse-dot"></div>
                    <span class="recording-timer" id="recordingTimer">00:00</span>
                </div>
                <div class="waveform-bars">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <span style="font-size: 0.75rem; color: #d8b4fe;">Release to send</span>
            </div>

            <input type="file" id="fileInput" style="display: none;" accept="image/*,video/*" onchange="handleFileSelect(event)">
            <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="Send Image or Video">📎</button>
            <button class="action-btn" id="recordBtn" title="Hold to Record Voice Message">🎤</button>
            <input type="text" id="messageInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)" autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let socket = null;
        if (typeof io !== 'undefined') {
            socket = io();
        }

        let currentUserName = '';
        let currentRoomId = '';
        let lastRenderedDateString = '';
        let selectedFilePayload = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingTimerInterval = null;
        let recordingSeconds = 0;

        const loginCard = document.getElementById('loginCard');
        const chatWrapper = document.getElementById('chatWrapper');
        const loginError = document.getElementById('loginError');
        const displayRoomId = document.getElementById('displayRoomId');
        const messagesBox = document.getElementById('messagesBox');
        const messageInput = document.getElementById('messageInput');
        const recordBtn = document.getElementById('recordBtn');
        const recordingOverlay = document.getElementById('recordingOverlay');
        const recordingTimer = document.getElementById('recordingTimer');

        function handleJoinSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const roomId = document.getElementById('roomId').value.trim();
            const roomPass = document.getElementById('roomPass').value.trim();

            if (!name || !roomId || !roomPass) {
                showError('Please fill in all fields!');
                return;
            }

            loginError.style.display = 'none';
            if (socket) {
                socket.emit('join-room', { name, roomId, roomPass });
            }
        }

        if (socket) {
            socket.on('join-response', (res) => {
                if (!res.success) {
                    showError(res.message);
                    return;
                }

                currentUserName = document.getElementById('userName').value.trim();
                currentRoomId = res.roomId;

                displayRoomId.textContent = `#${currentRoomId}`;
                loginCard.style.display = 'none';
                chatWrapper.style.display = 'flex';
                messagesBox.innerHTML = '';
                lastRenderedDateString = '';

                if (res.history && res.history.length > 0) {
                    res.history.forEach(msg => renderMessage(msg));
                    scrollToBottom();
                }
            });

            socket.on('chat-message', (msgData) => {
                renderMessage(msgData);
                scrollToBottom();
            });

            socket.on('message-updated', ({ id, message }) => {
                const row = document.querySelector(`[data-id="${id}"]`);
                if (row) {
                    const textDiv = row.querySelector('.bubble div');
                    if (textDiv) textDiv.innerHTML = formatMessageText(message);
                    const timestampSpan = row.querySelector('.time-stamp');
                    if (timestampSpan && !timestampSpan.textContent.includes('(edited)')) {
                        timestampSpan.textContent += ' (edited)';
                    }
                }
            });

            socket.on('message-removed', ({ id }) => {
                const row = document.querySelector(`[data-id="${id}"]`);
                if (row) row.remove();
            });
        }

        // --- UNIQUE CUSTOM VOICE RECORDING WAVEFORM LOGIC ---
        async function startVoiceRecording(e) {
            if (e) e.preventDefault();
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        selectedFilePayload = {
                            type: 'audio',
                            dataUrl: e.target.result,
                            fileName: 'voice-message.webm'
                        };
                        sendMessage();
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordingOverlay.style.display = 'flex';
                recordingSeconds = 0;
                recordingTimer.textContent = "00:00";
                
                recordingTimerInterval = setInterval(() => {
                    recordingSeconds++;
                    const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
                    const secs = String(recordingSeconds % 60).padStart(2, '0');
                    recordingTimer.textContent = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert("Microphone permission denied or unavailable.");
            }
        }

        function stopVoiceRecording(e) {
            if (e) e.preventDefault();
            if (!isRecording) return;

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            recordingOverlay.style.display = 'none';
            clearInterval(recordingTimerInterval);
        }

        recordBtn.addEventListener('mousedown', startVoiceRecording);
        recordBtn.addEventListener('touchstart', startVoiceRecording);
        recordBtn.addEventListener('mouseup', stopVoiceRecording);
        recordBtn.addEventListener('mouseleave', stopVoiceRecording);
        recordBtn.addEventListener('touchend', stopVoiceRecording);

        // --- EDIT & DELETE FUNCTIONS ---
        function editMessage(id) {
            const row = document.querySelector(`[data-id="${id}"]`);
            if (!row) return;
            const textDiv = row.querySelector('.bubble div');
            const currentText = textDiv ? textDiv.textContent : '';

            const newText = prompt("Edit your message:", currentText);
            if (newText !== null && newText.trim() !== '' && newText.trim() !== currentText) {
                socket.emit('edit-message', { id, newText: newText.trim() });
            }
        }

        function deleteMessage(id) {
            if (confirm("Are you sure you want to delete this message?")) {
                socket.emit('delete-message', { id });
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const fileType = file.type.startsWith('video') ? 'video' : 'image';
                selectedFilePayload = {
                    type: fileType,
                    dataUrl: e.target.result,
                    fileName: file.name
                };
                sendMessage();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function parseMessageDate(msg) {
            const rawTime = msg.timestamp || new Date();
            const parsed = new Date(rawTime);
            return isNaN(parsed.getTime()) ? new Date() : parsed;
        }

        function formatCustomTimestamp(dateObj) {
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const yy = String(dateObj.getFullYear()).slice(-2);
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            return `${dd}-${mm}-${yy} ${hh}-${min}`;
        }

        function renderMessage(msg) {
            const msgDate = parseMessageDate(msg);
            const formattedTimestamp = formatCustomTimestamp(msgDate);

            const dateStr = msgDate.toLocaleDateString(undefined, {
                weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
            });

            if (dateStr !== lastRenderedDateString) {
                lastRenderedDateString = dateStr;
                const dateDiv = document.createElement('div');
                dateDiv.className = 'date-separator';
                dateDiv.textContent = dateStr;
                messagesBox.appendChild(dateDiv);
            }

            const row = document.createElement('div');
            row.setAttribute('data-id', msg.id);

            if (msg.isSystem) {
                row.className = 'message-row system';
                row.innerHTML = `
                    <div class="system-pill">
                        <span>🔒 ${formatMessageText(msg.message)}</span>
                        <span style="font-size: 0.68rem; opacity: 0.75;">${formattedTimestamp}</span>
                    </div>
                `;
            } else {
                const isSelf = msg.name === currentUserName;
                row.className = `message-row ${isSelf ? 'self' : 'other'}`;

                let contentHtml = '';
                if (msg.file) {
                    if (msg.file.type === 'image') {
                        contentHtml += `<img src="${msg.file.dataUrl}" class="chat-media" onclick="window.open(this.src)" alt="Attachment">`;
                    } else if (msg.file.type === 'video') {
                        contentHtml += `<video src="${msg.file.dataUrl}" class="chat-video" controls playsinline></video>`;
                    } else if (msg.file.type === 'audio') {
                        contentHtml += `<audio src="${msg.file.dataUrl}" class="chat-audio" controls></audio>`;
                    }
                }
                if (msg.message) {
                    contentHtml += `<div>${formatMessageText(msg.message)}</div>`;
                }

                let actionsHtml = '';
                if (isSelf) {
                    actionsHtml = `
                        <div class="msg-actions">
                            <span class="msg-action-btn edit" onclick="editMessage('${msg.id}')">Edit</span>
                            <span class="msg-action-btn delete" onclick="deleteMessage('${msg.id}')">Delete</span>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <div class="sender-name">${escapeHTML(msg.name)}</div>
                    <div class="bubble">
                        ${contentHtml}
                        <span class="time-stamp">${formattedTimestamp} ${msg.edited ? '(edited)' : ''}</span>
                    </div>
                    ${actionsHtml}
                `;
            }

            messagesBox.appendChild(row);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedFilePayload) return;

            if (socket && socket.connected) {
                socket.emit('chat-message', {
                    message: text,
                    file: selectedFilePayload
                });
            }

            messageInput.value = '';
            selectedFilePayload = null;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        }

        function leaveRoom() {
            location.reload();
        }

        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        function scrollToBottom() {
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatMessageText(str) {
            if (!str) return '';
            const sanitized = escapeHTML(str);
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;

            return sanitized.replace(urlRegex, (url) => {
                const href = url.startsWith('www.') ? `http://${url}` : url;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: #64dfdf; text-decoration: underline; word-break: break-all;">${url}</a>`;
            });
        }
    </script>
</body>
</html>
