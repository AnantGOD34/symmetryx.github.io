<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flux 🔐</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="/socket.io/socket.io.js" onerror="window.socketIoFailed = true;"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-gradient: radial-gradient(circle at top right, #3c096c, #1a0033, #0d001a);
            --sphere-1-color: rgba(255, 123, 0, 0.4);
            --sphere-2-color: rgba(168, 85, 247, 0.45);
            --border-gradient: linear-gradient(135deg, #ff7b00, #a855f7, #ff2a85);
            --box-bg: rgba(22, 8, 42, 0.85);
            --btn-bg: linear-gradient(135deg, #ff6000 0%, #ff9e00 50%, #9333ea 100%);
            --self-bubble: linear-gradient(135deg, #ff6000 0%, #c084fc 60%, #9333ea 100%);
            --sender-gradient: linear-gradient(90deg, #e879f9, #ff7b00);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 2s ease;
        }

        .glow-sphere-1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, var(--sphere-1-color), transparent 70%);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }
        .glow-sphere-2 {
            position: absolute;
            bottom: -15%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--sphere-2-color), transparent 70%);
            filter: blur(90px);
            border-radius: 50%;
            pointer-events: none;
            transition: background 2s ease;
        }

        .gradient-box {
            position: relative;
            background: var(--box-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 1px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 123, 0, 0.2);
            transition: background 2s ease;
        }

        .gradient-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 2px;
            background: var(--border-gradient);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 2s ease;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
            z-index: 10;
        }

        .login-card h2 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff9e00, #ff6000, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .login-card p {
            font-size: 0.9rem;
            color: #d8b4fe;
            margin-bottom: 26px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: linear-gradient(90deg, #ff9e00, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(12, 3, 26, 0.7);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus {
            border-color: transparent;
            background: rgba(20, 6, 40, 0.9);
            box-shadow: 0 0 0 2px #ff7b00, 0 0 15px rgba(255, 123, 0, 0.4);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--btn-bg);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 20px rgba(255, 96, 0, 0.4);
            transition: transform 0.2s ease, opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .error-msg {
            color: #ff4d6d;
            font-size: 0.85rem;
            margin-top: 12px;
            display: none;
            font-weight: 600;
        }

        .chat-wrapper {
            display: none;
            width: 95%;
            max-width: 950px;
            height: 90vh;
            flex-direction: column;
            overflow: hidden;
            z-index: 10;
        }

        .chat-header {
            padding: 18px 24px;
            background: linear-gradient(90deg, rgba(30, 8, 55, 0.9), rgba(18, 4, 34, 0.95));
            border-bottom: 1px solid rgba(255, 123, 0, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            transition: background 0.3s;
        }

        .chat-header.selection-mode {
            background: linear-gradient(90deg, #3c096c, #5a189a);
        }

        .chat-header .room-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background: var(--btn-bg);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .chat-header h3 {
            font-size: 1.2rem;
            background: linear-gradient(90deg, #ffffff, #ffb703, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-action-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }
        .header-action-btn.show { display: inline-block; }
        .header-action-btn.delete-bulk:hover { background: #ef4444; border-color: #f87171; }

        .leave-btn {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(255, 96, 0, 0.2));
            border: 1px solid rgba(255, 96, 0, 0.5);
            color: #ffb703;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }

        .leave-btn:hover {
            background: linear-gradient(135deg, #ef4444, #ff6000);
            color: white;
        }

        .messages-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            background: rgba(14, 3, 28, 0.6);
        }

        .messages-box::-webkit-scrollbar {
            width: 7px;
        }
        .messages-box::-webkit-scrollbar-thumb {
            background: var(--border-gradient);
            border-radius: 10px;
        }

        .date-separator {
            align-self: center;
            margin: 12px 0;
            padding: 4px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #d8b4fe;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            position: relative;
            cursor: pointer;
        }

        .message-row.self { align-self: flex-end; }
        .message-row.other { align-self: flex-start; }
        .message-row.system { align-self: center; max-width: 90%; text-align: center; cursor: default; }

        .msg-checkbox {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.4);
            z-index: 10;
        }
        .message-row.selecting .msg-checkbox { display: flex; }
        .message-row.self.selecting .msg-checkbox { left: -36px; }
        .message-row.other.selecting .msg-checkbox { right: -36px; }
        .message-row.selected .msg-checkbox { background: #ff9e00; border-color: #ffb703; }
        .message-row.selected .msg-checkbox::after { content: '✓'; color: #000; font-size: 13px; font-weight: bold; }
        .message-row.selected .bubble { filter: brightness(1.15); box-shadow: 0 0 0 2px #ff9e00; }

        .system-pill {
            background: linear-gradient(135deg, rgba(255, 123, 0, 0.15), rgba(168, 85, 247, 0.2));
            border: 1px solid rgba(255, 157, 0, 0.4);
            color: #f3e8ff;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .sender-name {
            font-size: 0.75rem;
            font-weight: 800;
            margin-bottom: 4px;
            padding-left: 2px;
            background: linear-gradient(90deg, #ff9e00, #ff6000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message-row.self .sender-name {
            text-align: right;
            padding-right: 2px;
            background: var(--sender-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }

        .message-row.self .bubble {
            background: var(--self-bubble);
            color: #ffffff;
            border-bottom-right-radius: 2px;
            box-shadow: 0 6px 18px rgba(255, 96, 0, 0.35);
        }

        .message-row.other .bubble {
            background: linear-gradient(135deg, rgba(48, 14, 82, 0.95), rgba(28, 6, 52, 0.95));
            border: 1px solid rgba(255, 123, 0, 0.35);
            color: #f3e8ff;
            border-bottom-left-radius: 2px;
        }

        .quoted-reply {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid #ff9e00;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.82rem;
            opacity: 0.9;
        }
        .quoted-reply-sender { font-weight: bold; color: #ffb703; margin-bottom: 2px; }

        .time-stamp {
            font-size: 0.68rem;
            opacity: 0.85;
            margin-top: 5px;
            display: block;
            text-align: right;
            color: rgba(255, 255, 255, 0.85);
        }

        .msg-actions {
            font-size: 0.72rem;
            display: flex;
            gap: 8px;
            margin-top: 4px;
            justify-content: flex-end;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .message-row.selecting .msg-actions { display: none; }
        .message-row:hover .msg-actions { opacity: 1; }

        .msg-action-btn {
            cursor: pointer;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .msg-action-btn.edit:hover { background: rgba(255, 183, 3, 0.3); color: #ffb703; }
        .msg-action-btn.delete:hover { background: rgba(239, 68, 68, 0.3); color: #ef4444; }
        .msg-action-btn.reply:hover { background: rgba(168, 85, 247, 0.3); color: #d8b4fe; }
        .msg-action-btn.react:hover { background: rgba(52, 211, 153, 0.3); color: #34d399; }

        .reactions-container { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .message-row.self .reactions-container { justify-content: flex-end; }
        .reaction-badge {
            background: rgba(30, 10, 50, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 12px; padding: 2px 8px; font-size: 0.78rem; display: flex; align-items: center; gap: 4px; cursor: pointer;
        }
        .reaction-badge.active { border-color: #ff9e00; background: rgba(255, 158, 0, 0.2); }

        /* Full Emoji Picker Popover */
        .emoji-picker-popover {
            display: none;
            position: absolute;
            bottom: 100%;
            background: rgba(18, 4, 38, 0.98);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 16px;
            padding: 12px;
            z-index: 200;
            backdrop-filter: blur(15px);
            width: 300px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .message-row.self .emoji-picker-popover { right: 0; }
        .message-row.other .emoji-picker-popover { left: 0; }
        .emoji-picker-popover.show { display: block; }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            margin-top: 6px;
        }
        .emoji-option {
            cursor: pointer;
            font-size: 1.25rem;
            text-align: center;
            padding: 4px;
            border-radius: 6px;
            transition: transform 0.1s, background 0.1s;
        }
        .emoji-option:hover {
            transform: scale(1.3);
            background: rgba(255,255,255,0.15);
        }
        .emoji-category-title {
            font-size: 0.72rem;
            color: #d8b4fe;
            text-transform: uppercase;
            margin-top: 8px;
            margin-bottom: 4px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 2px;
        }

        .link-preview {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit;
        }
        .link-preview-title { font-weight: bold; font-size: 0.9rem; color: #ffb703; }
        .link-preview-desc { font-size: 0.78rem; opacity: 0.8; }
        .link-preview-url { font-size: 0.7rem; opacity: 0.5; }

        .typing-indicator-bar {
            height: 22px; padding: 0 24px; font-size: 0.78rem; color: #d8b4fe; font-style: italic; display: none; align-items: center; background: rgba(14, 3, 28, 0.6);
        }
        .typing-indicator-bar.show { display: flex; }

        .reply-banner {
            display: none; background: rgba(30, 10, 50, 0.9); border-left: 3px solid #ff9e00; padding: 8px 14px; font-size: 0.82rem; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 123, 0, 0.2);
        }
        .reply-banner.show { display: flex; }

        .chat-media { max-width: 240px; max-height: 240px; border-radius: 12px; margin-bottom: 6px; object-fit: cover; display: block; cursor: pointer; }
        .chat-video { width: 100%; max-width: 280px; border-radius: 12px; margin-bottom: 6px; outline: none; display: block; }
        .chat-audio { width: 220px; height: 36px; margin-bottom: 4px; }

        .action-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(168, 85, 247, 0.4); color: white; padding: 10px 14px; border-radius: 12px; cursor: pointer; font-size: 1rem; user-select: none;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.2); }

        #recordingOverlay {
            display: none; position: absolute; bottom: 85px; left: 20px; right: 20px; background: rgba(18, 4, 38, 0.95);
            border: 1px solid rgba(255, 123, 0, 0.5); border-radius: 16px; padding: 14px 20px; align-items: center; justify-content: space-between; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(10px);
        }
        .recording-info { display: flex; align-items: center; gap: 12px; }
        .recording-pulse-dot { width: 12px; height: 12px; background: #ef4444; border-radius: 50%; animation: pulseDot 1s infinite alternate; }
        @keyframes pulseDot { from { transform: scale(0.8); opacity: 0.6; } to { transform: scale(1.2); opacity: 1; } }
        .recording-timer { font-family: monospace; font-size: 1.1rem; color: #ffb703; font-weight: bold; }

        .chat-input-area {
            position: relative; background: linear-gradient(90deg, rgba(20, 5, 38, 0.95), rgba(12, 3, 24, 0.95));
            border-top: 1px solid rgba(255, 123, 0, 0.25); display: flex; flex-direction: column; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px;
        }
        .chat-input-row { padding: 16px 20px; display: flex; gap: 12px; align-items: center; }
        .chat-input-area input[type="text"] {
            flex: 1; padding: 13px 18px; background: rgba(10, 2, 20, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 12px; color: white; font-size: 0.98rem; outline: none;
        }
        .send-btn {
            background: var(--btn-bg); border: none; color: white; padding: 13px 24px; border-radius: 12px; font-weight: 800; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 96, 0, 0.4);
        }

        @media (max-width: 600px) {
            .chat-wrapper { width: 100%; height: 100vh; border-radius: 0; }
        }
    </style>
</head>
<body>

    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <div class="login-card gradient-box" id="loginCard">
        <h2>Flux</h2>
        <p>Enter details to join or create a private room</p>

        <form id="joinForm" onsubmit="handleJoinSubmit(event)">
            <div class="input-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="e.g. Alex" maxlength="20" required>
            </div>

            <div class="input-group">
                <label for="roomId">Room ID</label>
                <input type="text" id="roomId" placeholder="e.g. SecretZone" maxlength="25" required>
            </div>

            <div class="input-group">
                <label for="roomPass">Room Password</label>
                <input type="password" id="roomPass" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary" id="joinBtn">Join Flux Room</button>
            <div class="error-msg" id="loginError"></div>
        </form>
    </div>

    <div class="chat-wrapper gradient-box" id="chatWrapper">
        <div class="chat-header" id="chatHeader">
            <div class="room-title">
                <span class="room-badge" id="headerBadge">Flux</span>
                <h3 id="displayRoomId">Room</h3>
            </div>
            <div class="header-actions">
                <button class="header-action-btn delete-bulk" id="deleteBulkBtn" onclick="deleteSelectedMessages()">🗑️ Delete (<span id="selectedCount">0</span>)</button>
                <button class="header-action-btn" id="cancelSelectionBtn" onclick="exitSelectionMode()">✕</button>
                <button class="leave-btn" id="leaveRoomBtn" onclick="leaveRoom()">Leave Room</button>
            </div>
        </div>

        <div class="messages-box" id="messagesBox"></div>
        <div class="typing-indicator-bar" id="typingIndicatorBar"></div>

        <div class="chat-input-area">
            <div class="reply-banner" id="replyBanner">
                <div>
                    <span style="font-size: 0.75rem; color: #ffb703; font-weight: bold; display: block;" id="replyingToUser">Replying</span>
                    <span style="font-size: 0.8rem; opacity: 0.8;" id="replyingToText"></span>
                </div>
                <button onclick="cancelReply()" style="background:none; border:none; color:#fff; cursor:pointer; font-size:1rem;">✕</button>
            </div>

            <div id="recordingOverlay">
                <div class="recording-info">
                    <div class="recording-pulse-dot"></div>
                    <span class="recording-timer" id="recordingTimer">00:00</span>
                </div>
                <span style="font-size: 0.75rem; color: #d8b4fe;">Release to send</span>
            </div>

            <div class="chat-input-row">
                <input type="file" id="fileInput" style="display: none;" accept="image/*,video/*" onchange="handleFileSelect(event)">
                <button class="action-btn" onclick="document.getElementById('fileInput').click()" title="Send Image or Video">📎</button>
                <button class="action-btn" id="recordBtn" title="Hold to Record Voice Message">🎤</button>
                <input type="text" id="messageInput" placeholder="Type a message..." oninput="handleTypingInput()" onkeydown="handleKeyPress(event)" autocomplete="off">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let socket = null;
        if (typeof io !== 'undefined') {
            socket = io();
        }

        let currentUserName = '';
        let currentRoomId = '';
        let lastRenderedDateString = '';
        let selectedFilePayload = null;
        let activeReplyData = null;

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingTimerInterval = null;
        let recordingSeconds = 0;
        let typingTimeout = null;

        let isSelectionMode = false;
        let selectedMessageIds = new Set();
        let longPressTimer = null;

        // Comprehensive Emoji Categories

        function handleJoinSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value.trim();
            const roomId = document.getElementById('roomId').value.trim();
            const roomPass = document.getElementById('roomPass').value.trim();

            if (!name || !roomId || !roomPass) {
                showError('Please fill in all fields!');
                return;
            }

            loginError.style.display = 'none';
            if (socket) {
                socket.emit('join-room', { name, roomId, roomPass });
            }
        }

        if (socket) {
            socket.on('join-response', (res) => {
                if (!res.success) {
                    showError(res.message);
                    return;
                }

                currentUserName = document.getElementById('userName').value.trim();
                currentRoomId = res.roomId;

                displayRoomId.textContent = `#${currentRoomId}`;
                loginCard.style.display = 'none';
                chatWrapper.style.display = 'flex';
                messagesBox.innerHTML = '';
                lastRenderedDateString = '';

                if (res.history && res.history.length > 0) {
                    res.history.forEach(msg => renderMessage(msg));
                    scrollToBottom();
                }
            });

            socket.on('chat-message', (msgData) => {
                renderMessage(msgData);
                scrollToBottom();
            });

            socket.on('message-updated', ({ id, message }) => {
                const row = document.querySelector(`[data-id="${id}"]`);
                if (row) {
                    const textDiv = row.querySelector('.bubble-text');
                    if (textDiv) textDiv.innerHTML = formatMessageText(message);
                    const timestampSpan = row.querySelector('.time-stamp');
                    if (timestampSpan && !timestampSpan.textContent.includes('(edited)')) {
                        timestampSpan.textContent += ' (edited)';
                    }
                }
            });

            socket.on('messages-removed', ({ ids }) => {
                ids.forEach(id => {
                    const row = document.querySelector(`[data-id="${id}"]`);
                    if (row) row.remove();
                });
                exitSelectionMode();
            });

            socket.on('reaction-updated', ({ messageId, reactions }) => {
                const row = document.querySelector(`[data-id="${messageId}"]`);
                if (row) {
                    let container = row.querySelector('.reactions-container');
                    if (!container) {
                        container = document.createElement('div');
                        container.className = 'reactions-container';
                        row.querySelector('.bubble').appendChild(container);
                    }
                    container.innerHTML = renderReactionsHTML(reactions, messageId);
                }
            });

            let typingUsers = new Set();
            socket.on('user-typing', ({ name, isTyping }) => {
                if (isTyping) {
                    typingUsers.add(name);
                } else {
                    typingUsers.delete(name);
                }

                if (typingUsers.size > 0) {
                    const names = Array.from(typingUsers).join(', ');
                    typingIndicatorBar.textContent = `${names} ${typingUsers.size === 1 ? 'is' : 'are'} typing...`;
                    typingIndicatorBar.classList.add('show');
                } else {
                    typingIndicatorBar.classList.remove('show');
                }
            });
        }

        function handleTypingInput() {
            socket.emit('typing', true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', false);
            }, 1500);
        }

        function enterSelectionMode(id, senderName) {
            if (senderName !== currentUserName) return;
            isSelectionMode = true;
            chatHeader.classList.add('selection-mode');
            deleteBulkBtn.classList.add('show');
            cancelSelectionBtn.classList.add('show');
            leaveRoomBtn.style.display = 'none';
            headerBadge.style.display = 'none';

            document.querySelectorAll('.message-row').forEach(row => {
                if (row.dataset.sender === currentUserName) {
                    row.classList.add('selecting');
                }
            });

            toggleMessageSelection(id);
        }

        function toggleMessageSelection(id) {
            const row = document.querySelector(`[data-id="${id}"]`);
            if (!row || row.dataset.sender !== currentUserName) return;

            if (selectedMessageIds.has(id)) {
                selectedMessageIds.delete(id);
                row.classList.remove('selected');
            } else {
                selectedMessageIds.add(id);
                row.classList.add('selected');
            }

            selectedCountSpan.textContent = selectedMessageIds.size;
            if (selectedMessageIds.size === 0) {
                exitSelectionMode();
            }
        }

        function exitSelectionMode() {
            isSelectionMode = false;
            selectedMessageIds.clear();
            chatHeader.classList.remove('selection-mode');
            deleteBulkBtn.classList.remove('show');
            cancelSelectionBtn.classList.remove('show');
            leaveRoomBtn.style.display = 'block';
            headerBadge.style.display = 'inline-block';

            document.querySelectorAll('.message-row').forEach(row => {
                row.classList.remove('selecting', 'selected');
            });
        }

        function deleteSelectedMessages() {
            if (selectedMessageIds.size === 0) return;
            if (confirm(`Are you sure you want to delete ${selectedMessageIds.size} selected message(s)?`)) {
                socket.emit('delete-messages', { ids: Array.from(selectedMessageIds) });
            }
        }

        async function startVoiceRecording(e) {
            if (e) e.preventDefault();
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        selectedFilePayload = {
                            type: 'audio',
                            dataUrl: e.target.result,
                            fileName: 'voice-message.webm'
                        };
                        sendMessage();
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordingOverlay.style.display = 'flex';
                recordingSeconds = 0;
                recordingTimer.textContent = "00:00";
                
                recordingTimerInterval = setInterval(() => {
                    recordingSeconds++;
                    const mins = String(Math.floor(recordingSeconds / 60)).padStart(2, '0');
                    const secs = String(recordingSeconds % 60).padStart(2, '0');
                    recordingTimer.textContent = `${mins}:${secs}`;
                }, 1000);

            } catch (err) {
                alert("Microphone permission denied or unavailable.");
            }
        }

        function stopVoiceRecording(e) {
            if (e) e.preventDefault();
            if (!isRecording) return;

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            recordingOverlay.style.display = 'none';
            clearInterval(recordingTimerInterval);
        }

        recordBtn.addEventListener('mousedown', startVoiceRecording);
        recordBtn.addEventListener('touchstart', startVoiceRecording);
        recordBtn.addEventListener('mouseup', stopVoiceRecording);
        recordBtn.addEventListener('mouseleave', stopVoiceRecording);
        recordBtn.addEventListener('touchend', stopVoiceRecording);

        function setReply(id, senderName, text) {
            activeReplyData = { id, senderName, text };
            document.getElementById('replyingToUser').textContent = `Replying to ${senderName}`;
            document.getElementById('replyingToText').textContent = text || '[Attachment]';
            replyBanner.classList.add('show');
            messageInput.focus();
        }

        function cancelReply() {
            activeReplyData = null;
            replyBanner.classList.remove('show');
        }

        function toggleEmojiPicker(id, event) {
            event.stopPropagation();
            const popover = document.getElementById(`picker-${id}`);
            document.querySelectorAll('.emoji-picker-popover').forEach(p => {
                if (p !== popover) p.classList.remove('show');
            });
            popover.classList.toggle('show');
        }

        window.addEventListener('click', () => {
            document.querySelectorAll('.emoji-picker-popover').forEach(p => p.classList.remove('show'));
        });

        function addReaction(messageId, emoji) {
            socket.emit('toggle-reaction', { messageId, emoji });
            document.getElementById(`picker-${messageId}`).classList.remove('show');
        }

        function renderReactionsHTML(reactions, messageId) {
            if (!reactions || Object.keys(reactions).length === 0) return '';
            let html = '';
            for (const [emoji, users] of Object.entries(reactions)) {
                const hasReacted = users.includes(currentUserName);
                html += `
                    <div class="reaction-badge ${hasReacted ? 'active' : ''}" onclick="addReaction('${messageId}', '${emoji}')" title="${users.join(', ')}">
                        <span>${emoji}</span>
                        <span style="font-size: 0.7rem; font-weight: bold;">${users.length}</span>
                    </div>
                `;
            }
            return html;
        }

        function editMessage(id) {
            const row = document.querySelector(`[data-id="${id}"]`);
            if (!row) return;
            const textDiv = row.querySelector('.bubble-text');
            const currentText = textDiv ? textDiv.textContent : '';

            const newText = prompt("Edit your message:", currentText);
            if (newText !== null && newText.trim() !== '' && newText.trim() !== currentText) {
                socket.emit('edit-message', { id, newText: newText.trim() });
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                const fileType = file.type.startsWith('video') ? 'video' : 'image';
                selectedFilePayload = {
                    type: fileType,
                    dataUrl: e.target.result,
                    fileName: file.name
                };
                sendMessage();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function parseMessageDate(msg) {
            const rawTime = msg.timestamp || new Date();
            const parsed = new Date(rawTime);
            return isNaN(parsed.getTime()) ? new Date() : parsed;
        }

        function formatCustomTimestamp(dateObj) {
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const yy = String(dateObj.getFullYear()).slice(-2);
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const min = String(dateObj.getMinutes()).padStart(2, '0');
            return `${dd}-${mm}-${yy} ${hh}-${min}`;
        }

        function extractFirstUrl(text) {
            if (!text) return null;
            const match = text.match(/(https?:\/\/[^\s]+|www\.[^\s]+)/);
            return match ? match[0] : null;
        }

        function renderMessage(msg) {
            const msgDate = parseMessageDate(msg);
            const formattedTimestamp = formatCustomTimestamp(msgDate);

            const dateStr = msgDate.toLocaleDateString(undefined, {
                weekday: 'long', year: 'numeric', month: 'short', day: 'numeric'
            });

            if (dateStr !== lastRenderedDateString) {
                lastRenderedDateString = dateStr;
                const dateDiv = document.createElement('div');
                dateDiv.className = 'date-separator';
                dateDiv.textContent = dateStr;
                messagesBox.appendChild(dateDiv);
            }

            const row = document.createElement('div');
            row.setAttribute('data-id', msg.id);
            row.setAttribute('data-sender', msg.name);

            if (msg.isSystem) {
                row.className = 'message-row system';
                row.innerHTML = `
                    <div class="system-pill">
                        <span>🔒 ${formatMessageText(msg.message)}</span>
                        <span style="font-size: 0.68rem; opacity: 0.75;">${formattedTimestamp}</span>
                    </div>
                `;
            } else {
                const isSelf = msg.name === currentUserName;
                row.className = `message-row ${isSelf ? 'self' : 'other'}`;

                row.addEventListener('click', (e) => {
                    if (isSelectionMode) {
                        e.stopPropagation();
                        if (isSelf) toggleMessageSelection(msg.id);
                    }
                });

                row.addEventListener('mousedown', () => {
                    if (!isSelectionMode && isSelf) {
                        longPressTimer = setTimeout(() => enterSelectionMode(msg.id, msg.name), 600);
                    }
                });
                row.addEventListener('mouseup', () => clearTimeout(longPressTimer));
                row.addEventListener('touchstart', () => {
                    if (!isSelectionMode && isSelf) {
                        longPressTimer = setTimeout(() => enterSelectionMode(msg.id, msg.name), 600);
                    }
                });
                row.addEventListener('touchend', () => clearTimeout(longPressTimer));

                let replyHtml = '';
                if (msg.replyTo) {
                    replyHtml = `
                        <div class="quoted-reply">
                            <div class="quoted-reply-sender">${escapeHTML(msg.replyTo.senderName)}</div>
                            <div style="font-size: 0.78rem; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">${escapeHTML(msg.replyTo.text || '[Attachment]')}</div>
                        </div>
                    `;
                }

                let contentHtml = '';
                if (msg.file) {
                    if (msg.file.type === 'image') {
                        contentHtml += `<img src="${msg.file.dataUrl}" class="chat-media" onclick="window.open(this.src)" alt="Attachment">`;
                    } else if (msg.file.type === 'video') {
                        contentHtml += `<video src="${msg.file.dataUrl}" class="chat-video" controls playsinline></video>`;
                    } else if (msg.file.type === 'audio') {
                        contentHtml += `<audio src="${msg.file.dataUrl}" class="chat-audio" controls></audio>`;
                    }
                }

                if (msg.message) {
                    contentHtml += `<div class="bubble-text">${formatMessageText(msg.message)}</div>`;
                    
                    const foundUrl = extractFirstUrl(msg.message);
                    if (foundUrl) {
                        const cleanUrl = foundUrl.startsWith('www.') ? `http://${foundUrl}` : foundUrl;
                        try {
                            const domain = new URL(cleanUrl).hostname;
                            contentHtml += `
                                <a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" class="link-preview">
                                    <span class="link-preview-title">🔗 Web Link Preview</span>
                                    <span class="link-preview-desc">Click to visit external website and view contents.</span>
                                    <span class="link-preview-url">${domain}</span>
                                </a>
                            `;
                        } catch(e) {}
                    }
                }

                // Render Categorized Full Emoji Picker HTML
                let emojiPickerHtml = `<div class="emoji-picker-popover" id="picker-${msg.id}" onclick="event.stopPropagation()">`;
                for (const [category, emojis] of Object.entries(emojiCategories)) {
                    emojiPickerHtml += `<div class="emoji-category-title">${category}</div><div class="emoji-grid">`;
                    emojis.forEach(em => {
                        emojiPickerHtml += `<span class="emoji-option" onclick="addReaction('${msg.id}', '${em}')">${em}</span>`;
                    });
                    emojiPickerHtml += `</div>`;
                }
                emojiPickerHtml += `</div>`;

                let reactionsHtml = `<div class="reactions-container">${renderReactionsHTML(msg.reactions, msg.id)}</div>`;

                let actionsHtml = `
                    <div class="msg-actions">
                        <span class="msg-action-btn react" onclick="toggleEmojiPicker('${msg.id}', event)">😊 React</span>
                        <span class="msg-action-btn reply" onclick="setReply('${msg.id}', '${escapeHTML(msg.name)}', '${escapeHTML(msg.message || 'Attachment')}')">↩️ Reply</span>
                        ${isSelf ? `
                            <span class="msg-action-btn edit" onclick="editMessage('${msg.id}')">Edit</span>
                            <span class="msg-action-btn delete" onclick="enterSelectionMode('${msg.id}', '${escapeHTML(msg.name)}')">Select / Delete</span>
                        ` : ''}
                    </div>
                `;

                row.innerHTML = `
                    <div class="msg-checkbox"></div>
                    <div class="sender-name">${escapeHTML(msg.name)}</div>
                    <div class="bubble">
                        ${replyHtml}
                        ${contentHtml}
                        <span class="time-stamp">${formattedTimestamp} ${msg.edited ? '(edited)' : ''}</span>
                        ${reactionsHtml}
                        ${emojiPickerHtml}
                    </div>
                    ${actionsHtml}
                `;
            }

            messagesBox.appendChild(row);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text && !selectedFilePayload) return;

            if (socket && socket.connected) {
                socket.emit('chat-message', {
                    message: text,
                    file: selectedFilePayload,
                    replyTo: activeReplyData
                });
            }

            messageInput.value = '';
            selectedFilePayload = null;
            cancelReply();
            socket.emit('typing', false);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        }

        function leaveRoom() {
            if (socket) {
                socket.disconnect();
                socket.connect();
            }
            location.reload();
        }

        function showError(msg) {
            loginError.textContent = msg;
            loginError.style.display = 'block';
        }

        function scrollToBottom() {
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatMessageText(str) {
            if (!str) return '';
            const sanitized = escapeHTML(str);
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;

            return sanitized.replace(urlRegex, (url) => {
                const href = url.startsWith('www.') ? `http://${url}` : url;
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" style="color: #64dfdf; text-decoration: underline; word-break: break-all;">${url}</a>`;
            });
        }
    </script>
</body>
</html>
